<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task 3 — Form Validation</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="page">
  <div class="form-card">
    <p class="eyebrow">// create account</p>
    <h1>Sign up</h1>
    <p class="subtitle">All fields are validated as you type.</p>

    <form id="signupForm" novalidate>

      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Prem Sai J S" autocomplete="name" aria-describedby="nameError" aria-invalid="false" />
        <span class="error-msg" id="nameError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" aria-describedby="emailError" aria-invalid="false" />
        <span class="error-msg" id="emailError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" autocomplete="tel" aria-describedby="phoneError" aria-invalid="false" />
        <span class="error-msg" id="phoneError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" aria-describedby="passwordHint passwordError" aria-invalid="false" />
          <button type="button" class="toggle-visibility" data-target="password" aria-label="Show password" aria-pressed="false">👁</button>
        </div>
        <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
        <span class="hint-msg" id="passwordHint">Use 8+ characters with a number and a symbol.</span>
        <span class="error-msg" id="passwordError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" aria-describedby="confirmPasswordError" aria-invalid="false" />
          <button type="button" class="toggle-visibility" data-target="confirmPassword" aria-label="Show password" aria-pressed="false">👁</button>
        </div>
        <span class="error-msg" id="confirmPasswordError" aria-live="polite"></span>
      </div>

      <button type="submit" class="btn-submit">Create Account</button>

      <div class="success-banner" id="successBanner" role="status" aria-live="polite">
        ✓ Account created successfully! Welcome aboard.
      </div>
    </form>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
